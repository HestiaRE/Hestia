# .gitea/workflows/lint.yml
# Shell lint gate (#477). Modelled on mirror-on-release: no actions at all, a temporary clone, and
# a trap that removes it. Gitea only - the public mirror carries released code, never pipelines.
#
# HOST DEPENDENCY, complete list: git, shellcheck, shfmt, jq. Nothing else - no node (which is why there
# is no actions/checkout here: it is a node20 action), no package manager, no language runtime. The
# job installs nothing; if a tool is missing it says which and stops.
#
# What it is allowed to do: read a temporary clone and run two static analysers over it. It writes
# only inside that clone, pushes nothing, publishes nothing, and holds no credential - the single
# secret is the same local repo path mirror-on-release already uses. The runner it calls never
# rewrites a file, so this job cannot produce a commit even by accident.
name: Shell lint
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: hestiare
    steps:
      - name: Lint changed shell
        env:
          SRC_REPO_PATH: ${{ secrets.SRC_REPO_PATH }}
          REPO_SLUG: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=""
          for t in git shellcheck shfmt jq; do command -v "$t" > /dev/null 2>&1 || missing="$missing $t"; done
          if [ -n "$missing" ]; then
            echo "Missing on the runner host:$missing"
            echo "Install once, from the OS repos:  apt install$missing"
            echo "(This job deliberately installs nothing itself.)"
            exit 1
          fi

          workdir="$(mktemp -d -p /tmp lint.XXXXXX)"
          trap 'rm -rf "$workdir"' EXIT
          # Resolve the bare repo on this host. The configured path wins; if it is gone the
          # root is reused with the CURRENT owner/repo, because renaming an owner makes Gitea
          # MOVE the directory - the secret then points at a path that no longer exists while
          # every other reference (ssh, api, remotes) silently follows the rename.
          src="$SRC_REPO_PATH"
          if [ ! -d "$src" ]; then
            src="${SRC_REPO_PATH%/*/*}/$(echo "$REPO_SLUG" | tr '[:upper:]' '[:lower:]').git"
            echo "Note: SRC_REPO_PATH does not exist; using $src (derived from $REPO_SLUG)."
          fi
          if [ ! -e "$src/HEAD" ]; then
            echo "No bare repository at '$src'."
            echo "Set the SRC_REPO_PATH secret to the repo's path on this host"
            echo "(<gitea-data>/gitea-repositories/<owner>/<repo>.git, all lowercase)."
            exit 1
          fi
          # Local clone, no network and no credentials - same mechanism mirror-on-release uses.
          # Not --shared: that makes the clone borrow the source's object store, which is a needless
          # hazard for a throwaway checkout.
          git clone --quiet "file://${src}" "$workdir/repo"
          cd "$workdir/repo"
          git checkout --quiet --detach "${HEAD_SHA:-HEAD}"
          .gitea/tools/lint-shell.sh --base "origin/${BASE_REF:-dev}"
          # The system key registry: every JSON under share/ parses, and sys-keys.json passes the same
          # sysreg_check the smoke runs on a box (#932). jq is the one dependency this adds.
          .gitea/tools/check-sys-registry.sh

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: VERSION comes from the tree and has to agree with the tag
        run: |
          # VERSION is committed before the tag, so the source says what it is and a tarball built by
          # any other means says the same. Two sources for one number drift in silence, so this
          # compares instead of writing.
          tree=$(cat VERSION 2> /dev/null || true)
          # Empty is red, never "equal". The file was a build-time placeholder for a long time, and
          # two empty strings compare just fine.
          if [ -z "$tree" ]; then
            echo "VERSION is empty at ${GITHUB_REF_NAME}, so nothing was compared."
            echo "Commit the bump onto the commit the tag points at, then cut the tag again."
            exit 1
          fi
          if [ "$tree" != "${GITHUB_REF_NAME}" ]; then
            echo "VERSION says '$tree', the tag says '${GITHUB_REF_NAME}'."
            echo "Commit the bump onto the commit the tag points at, then cut the tag again."
            exit 1
          fi
          echo "VERSION and tag agree on ${GITHUB_REF_NAME}."

      - name: Build tarball
        run: |
          mkdir -p dist/hestiare-${VERSION}
          # Dev-only trees never ship: the tarball is what lands on a customer box.
          EXCLUDES=$(grep 'export-ignore' .gitattributes | awk '{print $1}')
          rsync -a \
            --exclude='.git*' \
            --exclude='dist' \
            --exclude='*/PROVENANCE.json' \
            $(for e in $EXCLUDES; do echo "--exclude=$e"; done) \
            . dist/hestiare-${VERSION}/
          tar -czf dist/hestiare-${VERSION}.tar.gz -C dist hestiare-${VERSION}
          # sha256sum is on every runner, so the checksum costs one line and no dependency. The
          # bare file name is what `sha256sum -c` wants, hence the subshell.
          ( cd dist && sha256sum hestiare-${VERSION}.tar.gz > hestiare-${VERSION}.tar.gz.sha256 )

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/hestiare-${{ env.VERSION }}.tar.gz
            dist/hestiare-${{ env.VERSION }}.tar.gz.sha256
          generate_release_notes: false
          body: |
            HestiaRE ${{ env.VERSION }}

            Install:
              curl -fsSL https://hestiare.com/install.sh
              bash install.sh

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build tarball
        run: |
          # The tag is the version; write it into the file the tree ships with.
          echo "${VERSION}" > VERSION
          mkdir -p dist/hestiare-${VERSION}
          # Dev-only trees never ship: the tarball is what lands on a customer box.
          EXCLUDES=$(grep 'export-ignore' .gitattributes | awk '{print $1}')
          rsync -a \
            --exclude='.git*' \
            --exclude='dist' \
            --exclude='*/PROVENANCE.json' \
            $(for e in $EXCLUDES; do echo "--exclude=$e"; done) \
            . dist/hestiare-${VERSION}/
          tar -czf dist/hestiare-${VERSION}.tar.gz -C dist hestiare-${VERSION}
          # sha256sum is on every runner, so the checksum costs one line and no dependency. The
          # bare file name is what `sha256sum -c` wants, hence the subshell.
          ( cd dist && sha256sum hestiare-${VERSION}.tar.gz > hestiare-${VERSION}.tar.gz.sha256 )

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/hestiare-${{ env.VERSION }}.tar.gz
            dist/hestiare-${{ env.VERSION }}.tar.gz.sha256
          generate_release_notes: false
          body: |
            HestiaRE ${{ env.VERSION }}

            Install:
              curl -fsSL https://hestiare.com/install.sh
              bash install.sh

# Server-wide fallback for PHP under mpm_event: every domain vhost sets its own SetHandler, and a .php that reaches
# apache without one is unclaimed. It goes to a socket nobody listens on (503), never to a shared pool or out as source.
# A handler and not "Require all denied": a Require in Files context outranks .htaccess, so every vhost had to grant
# again and took its customer's own Require away with it.
<IfModule mpm_event_module>
    <FilesMatch \.php$>
        <IfModule proxy_fcgi_module>
            SetHandler "proxy:unix:/run/hestia/php-unclaimed.sock|fcgi://localhost"
        </IfModule>
        <IfModule !proxy_fcgi_module>
            Require all denied
        </IfModule>
    </FilesMatch>
</IfModule>

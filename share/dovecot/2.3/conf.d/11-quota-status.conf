# exim asks at RCPT (acl_check_rcpt), so a full mailbox is refused in the session and never bounced days later.
# quota-status loads only the global plugins; before 15-lda.conf, or doveconf warns on every run. lda and lmtp name
# quota once more, which dovecot ignores.
mail_plugins = $mail_plugins quota
service quota-status {
  executable = quota-status -p postfix
  unix_listener quota-status {
    user = Debian-exim
    mode = 0600
  }
  client_limit = 1
}
plugin {
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
}

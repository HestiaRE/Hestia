########################################
# Dovecot conf file modified by Hestia #
########################################

# Sieve addon delivery service, deployed by h-add-sys-sieve (#596). exim's
# dovecot_virtual_delivery transport delivers here instead of running dovecot-lda.
# Numbered 25 so it lands after dovecot's own 20-lmtp.conf, whose settings it overrides;
# own file rather than an edit, because that setting is shared with the managesieve overlay.

protocols = $protocols lmtp

service lmtp {
  # group/mode: exim would not reach a root-owned default socket.
  unix_listener lmtp {
    group = mail
    mode = 0660
    user = dovecot
  }
}

protocol lmtp {
  # Debian's 20-lmtp.conf strips the domain here, for a userdb keyed by /etc/passwd. Ours is
  # keyed per domain, so the stripped name resolves the path to /etc/exim4/domains//passwd and
  # every recipient comes back "User doesn't exist".
  auth_username_format = %{user | lower}
  mail_plugins = $mail_plugins quota sieve
  # Defer rather than bounce over quota, as the appendfile transports do.
  quota_full_tempfail = yes
}

########################################
# Dovecot conf file modified by Hestia #
########################################

# Sieve addon delivery service, deployed by h-add-sys-sieve (#596). Numbered 25 so it
# lands after dovecot's own 20-lmtp.conf, whose settings it has to override. exim's
# dovecot_virtual_delivery transport hands local mail to this socket instead of
# running dovecot-lda: LMTP carries the envelope recipient over the protocol, so
# a sieve script can test it, including a +suffix. A command line could never carry one,
# because $local_part is tainted.
# Own file, not a change to dovecot.conf: that setting is shared with the
# managesieve overlay, and an addon does not edit what another addon owns.
# 2.3 appends to $protocols; 2.4 refuses that and needs a block, see its variant.

protocols = $protocols lmtp

service lmtp {
  # group/mode, because exim loads no supplementary groups for a transport and
  # would not reach a root-owned default socket.
  unix_listener lmtp {
    group = mail
    mode = 0660
    user = dovecot
  }
}

protocol lmtp {
  # Debian's own 20-lmtp.conf strips the domain here, for a userdb keyed by
  # /etc/passwd. Ours is keyed per domain, so the stripped name resolves the
  # passwd file path to /etc/exim4/domains//passwd and every recipient comes back
  # "User doesn't exist". The file sorts after theirs so this wins; their comment
  # says to remove it for exactly this kind of userdb (#596).
  auth_username_format = %{user | lower}
  mail_plugins = $mail_plugins quota sieve
  # Defer (not bounce) when over quota, matching exim's appendfile transports:
  # LMTP answers 452 and exim defers on it, no exit code has to be translated.
  quota_full_tempfail = yes
}

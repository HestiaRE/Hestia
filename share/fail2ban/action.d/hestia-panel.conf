# Fail2Ban configuration file for hestia: the panel login jail
# Bans on the panel port AND on 80/443, where a panel-proxy domain (#878) takes the same login. WEB is shared
# with other jails, so stopping this one leaves it standing.

[Definition]

actionstart = /usr/local/hestia/bin/h-add-firewall-chain HESTIA
              /usr/local/hestia/bin/h-add-firewall-chain WEB
actionstop = /usr/local/hestia/bin/h-delete-firewall-chain HESTIA yes
actioncheck = /usr/local/hestia/bin/h-check-firewall-chain HESTIA
actionban = /usr/local/hestia/bin/h-add-firewall-ban <ip> HESTIA
            /usr/local/hestia/bin/h-add-firewall-ban <ip> WEB
# HESTIA_F2B_CALLER: fail2ban answers no client while it runs this, so the command must not call it back.
actionunban = HESTIA_F2B_CALLER=1 /usr/local/hestia/bin/h-delete-firewall-ban <ip> HESTIA
              HESTIA_F2B_CALLER=1 /usr/local/hestia/bin/h-delete-firewall-ban <ip> WEB

# Fail2Ban configuration file for hestia

[Definition]

actionstart = /usr/local/hestia/bin/h-add-firewall-chain <name>
actionstop = /usr/local/hestia/bin/h-delete-firewall-chain <name> yes
actioncheck = /usr/local/hestia/bin/h-check-firewall-chain <name>
actionban = /usr/local/hestia/bin/h-add-firewall-ban <ip> <name>
# HESTIA_F2B_CALLER: fail2ban answers no client while it runs this, so the command must not call it back.
actionunban = HESTIA_F2B_CALLER=1 /usr/local/hestia/bin/h-delete-firewall-ban <ip> <name>

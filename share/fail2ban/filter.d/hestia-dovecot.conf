# One failed login is one line: the *-login summary. The stock filter matches nothing from dovecot 2.4 ("Login aborted",
# #1171) and counts every 2.3 failure twice, once more on the user-less "Password mismatch" line of the auth process.
# F-USER feeds the mail password grace (#1155). It is greedy on purpose: the real ", method=.., rip=" block is the last
# one on the line, so a crafted user name cannot supply the address that gets banned.

[Definition]

failregex = ^\s*(?:imap|pop3|managesieve|submission)-login: Info: (?:Login aborted|Aborted login|Disconnected)(?:: [^(]*)? \(auth failed, \d+ attempts(?: in \d+ secs)?\)(?: \(auth_failed\))?: user=<<F-USER>.*</F-USER>>, method=\S+, rip=<ADDR>, lip=\S+

ignoreregex =

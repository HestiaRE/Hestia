; HestiaRE - Roundcube FPM pool (served by the Panel-Caddy's internal webmail
; listener, see share/panel-caddy/webmail-roundcube.conf; deployed by
; h-add-sys-roundcube, removed by h-delete-sys-roundcube, #205).
; Runs as the caddy user - matches the root:caddy config ownership and the
; caddy:caddy log dir that h-add-sys-roundcube sets up. This is what fixes the
; old model where a www-data pool rendered caddy-owned app state (W7/#234).
; NOTE: php-fpm parses pool configs as PHP-INI - comments MUST use ';' not '#'.
[roundcube]
listen = /run/hestia-webmail-roundcube.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

user = caddy
group = caddy

pm = ondemand
pm.max_children = 6
pm.max_requests = 1000
pm.process_idle_timeout = 10s

env[PATH] = /usr/local/bin:/usr/bin:/bin
; C.UTF-8, not en_US.UTF-8: that one is generated on none of the four targets, so every
; locale-aware child warned. This is built into glibc and needs no locale-gen.
env[LANG] = C.UTF-8

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/hestia-php-fpm.log
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 256M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
; Roundcube's own temp dir (Debian package layout); chowned caddy:caddy by
; h-add-sys-roundcube. Sessions live in the roundcube DB; these cover PHP-level
; session bootstrap, uploads and sys temp.
php_admin_value[session.save_path] = /var/lib/roundcube/temp
php_admin_value[upload_tmp_dir] = /var/lib/roundcube/temp
php_admin_value[sys_temp_dir] = /var/lib/roundcube/temp
; PHP 8.5 made array_first()/array_last() core functions; Roundcube <= 1.6.11
; still declares them unguarded (upstream fixed it 2025-10 with a guarded polyfill,
; resolute has not picked it up), so every request dies on a redeclare fatal.
; disable_functions removes the natives entirely (PHP 8.0+ semantics: userland
; may then redefine), Roundcube's own implementations load and win. Harmless
; where the natives do not exist (unknown names are ignored) and once the fix
; arrives (its polyfill checks function_exists).
php_admin_value[disable_functions] = array_first,array_last
; The OPcache is shared by every pool of this master, and code compiled against the shortened function
; table calls the wrong neighbour in the others: pma or Roundcube 500, whichever came second (#1149).
php_admin_flag[opcache.enable] = off

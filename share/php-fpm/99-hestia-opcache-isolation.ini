; All pools of a PHP version share one OPcache: no customer script may read another's cached files or drive the cache.
; restrict_api names a path that does not exist and no customer can create. Sorts after 10-opcache.ini on purpose.
opcache.validate_permission=1
opcache.validate_root=1
opcache.restrict_api=/nonexistent-hestia-opcache-api/

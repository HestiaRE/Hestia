; The [global] of one customer's PHP-FPM master; written by customer_fpm_sync (include/fpm.sh). Root's, do not edit.
[global]
error_log = syslog
syslog.ident = php%version%-fpm-%user%
log_level = error
emergency_restart_threshold = 10
emergency_restart_interval = 60s
process_control_timeout = 10s
events.mechanism = epoll
include=/etc/php/%version%/fpm/users/%user%/*.conf
